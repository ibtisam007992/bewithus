<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الرد على رسالة المدرسة</title>
<meta property="og:title" content="الرد على رسالة المدرسة">
<meta property="og:description" content="مدرسة خولة بنت حكيم (9-12) — منصة كُنْ مَعَنا">
<meta property="og:image" content="https://ibtisam007992.github.io/bewithus/icon-512.png">
<meta name="robots" content="noindex">
<style>
body{margin:0;font-family:Tahoma,sans-serif;background:#eef3f8;color:#0b2545;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}
a{color:#1f6fc5;font-weight:700}
</style>
</head>
<body>
<p id="msg">جاري فتح صفحة الرد…</p>
<script>
  // Short reply link: /bewithus/r?TOKEN -> the replies Apps Script page.
  var SCRIPT = 'https://script.google.com/macros/s/AKfycbznLNA-DDcueKreqoE4qWC5N_gUjYaea_RyOz8Jie_6Vbr9Wez2Vrr5BPLmLEOaSN2cXw/exec';
  var q = (location.search || '').replace(/^\?/, '');
  var isParentPage = /^p=/.test(q);                       // r?p=TOKEN -> parent's school-communication page
  var token = q.replace(/^[rp]=/, '').replace(/[^a-z0-9]/g, '');
  if (token) {
    location.replace(SCRIPT + (isParentPage ? '?p=' : '?r=') + token);
  } else {
    document.getElementById('msg').textContent = 'الرابط غير مكتمل. يمكنكم الرد مباشرة عبر واتساب.';
  }
</script>
</body>
</html>
